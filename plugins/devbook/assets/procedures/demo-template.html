<!--
  The managed region of the demo template. A demo copies it byte for byte and never edits it:
  a change to it is a change to .devbook/design/demo-template.html, and every demo is refreshed
  from there. Everything else in the file is the demo's own:
    <script type="application/json" id="demo-meta">   {"question": "…"}, in <head>
    <main data-demo-app>                              the screens
    <script type="application/json" id="demo-model">  what the panel reads, after <main>

  Inside <main data-demo-app>:
    <section id="…" data-screen>  one screen, or one state of a screen; its address is #id
    data-anchor="…"               an element a note or a walkthrough step points at
    href="#id", data-goto="#id"   move to a screen; on a <form>, once its native validation passes
    data-dialog="id", data-close  open a <dialog> modally, close the one around the button
    data-if-role="a b"            shown only for these roles
    data-if-flag="key" / "!key"   shown only while the flag is on / off
    data-if-setting="key=value"   shown only while the setting has that value
    data-variant="key"            shown only while that variant is chosen
  <main> carries data-role, data-flags, data-variant, and data-setting-<key> for the demo's own CSS.

  demo-model:
    app           {"name", "home"}: the product name in the shell, the first screen's id
    screens       [{"id", "title", "nav"?, "of"?, "anchors": [...]}]; "nav" puts the screen in
                  the shell's navigation, "of" files it under another screen — a state of that
                  screen, whose section also carries data-state="…", or a screen reached from it
    roles         [{"key", "label", "default"?}]
    flags         [{"key", "label", "default"?}]: "default" true means switched on
    settings      [{"key", "label", "options": [{"value", "label"}], "default"?}]
    viewports     [{"key", "label", "width"?, "default"?}]: width in px; none fills the window
    variants      [{"key", "label"}]: the panel switches them while there are two or more
    walkthroughs  [{"id", "title", "part"? | "journey"?, "signature"?,
                    "steps": [{"screen", "anchor"?, "role"?, "flags"?, "part"?, "step"?, "text"}]}]
                  free: "id" is the slug of the #### Scenario: it plays, each step's "text"
                  the scenario line it shows. linked: "part" is "<page>.md#<part>", the
                  scenario page part it shows; "signature" the page signature its text was
                  copied at; each step's "step" the 1-based index of the part step it
                  shows and "text" that step's English text, embedded so nothing is fetched.
                  playthrough: "journey" is "<page>.md#<journey>", the journey it plays end
                  to end; each step's "part" the anchor of the part it shows and "step" that
                  part step's index, in the journey's order. A playthrough shows a caption
                  over the product and its steps grouped by part; Play advances any
                  walkthrough on its own

  Addresses and the five messages follow devbook's demo-address contract,
  devbook.demo.address@1. demo:ready carries the hash above as its template version.
-->

<script>
(() => {
  "use strict";
  const V = 1;
  const PACE = 4000; // ms a playing walkthrough rests on each step
  const hosted = window.parent !== window;
  const list = (x) => (Array.isArray(x) ? x : []);
  const words = (s) => String(s || "").split(/[\s,]+/).filter(Boolean);
  const byKey = (arr, key) => arr.find((x) => x.key === key);

  function readJson(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e) { console.error(`demo: #${id} is not valid JSON`, e); return null; }
  }

  function templateVersion() {
    const it = document.createNodeIterator(document.documentElement, NodeFilter.SHOW_COMMENT);
    for (let n = it.nextNode(); n; n = it.nextNode()) {
      const m = /template:begin hash=(\S+)/.exec(n.nodeValue);
      if (m) return m[1];
    }
    return null;
  }

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c != null && c !== false) el.append(c);
    return el;
  }

  function post(type, payload) {
    if (!hosted) return;
    try { window.parent.postMessage({ type, v: V, ...payload }, "*"); } catch (e) { /* the host is gone */ }
  }

  function start() {
    const stage = document.querySelector("[data-demo-stage]");
    const shell = stage.querySelector("[data-demo-shell]");
    const pinLayer = stage.querySelector("[data-demo-pins]");
    const caption = stage.querySelector("[data-demo-caption]");
    const cap = (name) => caption.querySelector(`[data-demo-caption-${name}]`);
    const body = document.querySelector("[data-demo-panel-body]");
    const app = document.querySelector("main[data-demo-app]");
    if (!app) { body.append(h("p", { class: "dp-error", text: "This file has no main[data-demo-app]." })); return; }
    stage.insertBefore(app, pinLayer);

    const model = readJson("demo-model") || {};
    const meta = readJson("demo-meta") || {};
    const sectionOf = (id) => {
      const el = id ? document.getElementById(id) : null;
      return el && app.contains(el) && el.matches("section[data-screen]") ? el : null;
    };
    const screens = list(model.screens).filter((s) => {
      if (s && typeof s.id === "string" && sectionOf(s.id)) return true;
      console.warn("demo: demo-model lists a screen with no section[data-screen]", s);
      return false;
    });
    const byId = new Map(screens.map((s) => [s.id, s]));
    const anchorEl = (screen, anchor) => {
      const s = byId.get(screen);
      if (!s || !anchor || !list(s.anchors).includes(anchor)) return null;
      return sectionOf(screen).querySelector(`[data-anchor="${CSS.escape(anchor)}"]`);
    };
    const roles = list(model.roles), flags = list(model.flags), settings = list(model.settings);
    const viewports = list(model.viewports), variants = list(model.variants);
    const resolves = (st) => st && byId.has(st.screen) && (!st.anchor || anchorEl(st.screen, st.anchor))
      && (!st.role || byKey(roles, st.role)) && list(st.flags).every((f) => byKey(flags, f));
    const walks = list(model.walkthroughs).filter((w) => {
      if (w && typeof w.id === "string" && list(w.steps).length && w.steps.every(resolves)) return true;
      console.warn("demo: a walkthrough in demo-model does not resolve", w);
      return false;
    });
    const firstKey = (arr) => ((arr.find((x) => x.default) || arr[0] || {}).key ?? null);
    const defaults = { role: firstKey(roles), flags: flags.filter((f) => f.default).map((f) => f.key), vp: firstKey(viewports) };
    const home = model.app && byId.has(model.app.home) ? model.app.home : screens[0] && screens[0].id;

    const state = {
      screen: home, anchor: null, walk: null, annotate: false, pins: [],
      role: defaults.role, flags: new Set(defaults.flags), vp: defaults.vp,
      variant: variants.length ? variants[0].key : null,
      settings: Object.fromEntries(settings.map((s) => [s.key, s.default ?? (list(s.options)[0] || {}).value])),
    };

    // ---- Addresses: devbook.demo.address@1 ----
    function parse(address) {
      let s = String(address || "");
      const hash = s.indexOf("#");
      if (hash < 0) return null;
      s = s.slice(hash + 1);
      let query = "";
      const q = s.indexOf("?");
      if (q >= 0) { query = s.slice(q + 1); s = s.slice(0, q); }
      let parts;
      try { parts = s.split("/").map(decodeURIComponent); } catch (e) { return null; }
      if (parts[0] === "walkthrough") {
        const walk = walks.find((w) => w.id === parts[1]);
        const step = parts.length > 2 ? Number(parts[2]) : 1;
        if (!walk || parts.length > 3 || !Number.isInteger(step) || step < 1 || step > walk.steps.length) return null;
        return { walk, step };
      }
      if (parts.length > 2 || !byId.has(parts[0])) return null;
      const out = { screen: parts[0], anchor: parts[1] || null };
      if (out.anchor && !anchorEl(out.screen, out.anchor)) return null;
      const params = new URLSearchParams(query);
      if (params.has("role")) { out.role = params.get("role"); if (!byKey(roles, out.role)) return null; }
      if (params.has("flags")) { out.flags = words(params.get("flags")); if (!out.flags.every((f) => byKey(flags, f))) return null; }
      if (params.has("vp")) { out.vp = params.get("vp"); if (!byKey(viewports, out.vp)) return null; }
      return out;
    }

    function query() {
      const q = [];
      const on = [...state.flags].sort();
      if (state.role && state.role !== defaults.role) q.push(`role=${encodeURIComponent(state.role)}`);
      if (on.join() !== [...defaults.flags].sort().join()) q.push(`flags=${on.map(encodeURIComponent).join(",")}`);
      if (state.vp && state.vp !== defaults.vp) q.push(`vp=${encodeURIComponent(state.vp)}`);
      return q.length ? `?${q.join("&")}` : "";
    }
    const screenAddress = (anchor) => `#${state.screen}${anchor ? `/${anchor}` : ""}${query()}`;
    const address = () => (state.walk ? `#walkthrough/${state.walk.id}/${state.walk.step}` : screenAddress(state.anchor));

    // ---- Playing: a walkthrough advancing on its own, every PACE ms, until its last step ----
    let timer = null, advancing = false;
    const playing = () => timer !== null;
    const currentWalk = () => (state.walk && walks.find((x) => x.id === state.walk.id)) || null;
    const partLabel = (anchor) => String(anchor || "").replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase());
    function stopPlaying() { if (timer !== null) { clearTimeout(timer); timer = null; } }
    function play() {
      stopPlaying();
      const w = currentWalk();
      if (!w) return;
      if (state.walk.step >= w.steps.length) open({ walk: w, step: 1 }, false);
      const tick = () => {
        const cur = currentWalk();
        if (!cur || state.walk.step >= cur.steps.length) { timer = null; render(false); return; }
        advancing = true;
        open({ walk: cur, step: state.walk.step + 1 }, false);
        advancing = false;
        timer = setTimeout(tick, PACE);
      };
      timer = setTimeout(tick, PACE);
      render(false);
    }
    const togglePlay = () => { if (playing()) { stopPlaying(); render(false); } else play(); };

    // Opens a parsed address. A host's address and the URL reset what they omit to the panel's
    // default; a link inside the demo keeps the panel as it is. Anything but the player's own
    // advance stops a walkthrough that is playing.
    function open(p, reset) {
      if (!p) return false;
      if (!advancing) stopPlaying();
      if (p.walk) {
        const st = p.walk.steps[p.step - 1];
        state.walk = { id: p.walk.id, step: p.step };
        state.screen = st.screen;
        state.anchor = st.anchor || null;
        if (st.role) state.role = st.role;
        if (st.flags) state.flags = new Set(st.flags);
      } else {
        state.walk = null;
        state.screen = p.screen;
        state.anchor = p.anchor;
        if (reset || p.role) state.role = p.role ?? defaults.role;
        if (reset || p.flags) state.flags = new Set(p.flags ?? defaults.flags);
        if (reset || p.vp) state.vp = p.vp ?? defaults.vp;
      }
      render(true);
      return true;
    }
    const navigate = (target) => open(parse(target), false) || console.warn(`demo: ${target} does not resolve`);

    // ---- Rendering ----
    function visible(el) {
      const d = el.dataset;
      if (d.ifRole != null && !words(d.ifRole).includes(state.role)) return false;
      if (d.ifFlag != null && !words(d.ifFlag).every((f) => (f[0] === "!" ? !state.flags.has(f.slice(1)) : state.flags.has(f)))) return false;
      if (d.ifSetting != null && !words(d.ifSetting).every((pair) => { const [k, v] = pair.split("="); return String(state.settings[k]) === v; })) return false;
      if (d.variant != null && state.variant && d.variant !== state.variant) return false;
      return true;
    }

    function render(moved) {
      for (const sec of app.querySelectorAll("section[data-screen]")) sec.hidden = sec.id !== state.screen;
      for (const el of app.querySelectorAll("[data-if-role], [data-if-flag], [data-if-setting], [data-variant]")) {
        if (!el.matches("section[data-screen]")) el.hidden = !visible(el);
      }
      app.dataset.role = state.role || "";
      app.dataset.flags = [...state.flags].join(" ");
      if (state.variant) app.dataset.variant = state.variant;
      for (const [k, v] of Object.entries(state.settings)) app.setAttribute(`data-setting-${k}`, v);

      const vp = byKey(viewports, state.vp);
      stage.style.maxWidth = vp && vp.width ? `${vp.width}px` : "";
      document.documentElement.toggleAttribute("data-demo-framed", !!(vp && vp.width));
      app.toggleAttribute("data-demo-annotate", state.annotate);

      renderShell();
      updatePanel();
      for (const el of document.querySelectorAll("[data-demo-spot]")) el.removeAttribute("data-demo-spot");
      const spot = anchorEl(state.screen, state.anchor);
      if (spot) spot.setAttribute("data-demo-spot", "");
      if (moved) {
        if (spot) spot.scrollIntoView({ block: "center" });
        else window.scrollTo(0, 0);
      }
      placePins();
      sync();
    }

    function renderShell() {
      const current = byId.get(state.screen) || {};
      const role = byKey(roles, state.role);
      shell.replaceChildren(
        h("span", { class: "shell-brand", text: (model.app && model.app.name) || "Product" }),
        h("nav", { class: "shell-nav", "aria-label": "Main" }, screens.filter((s) => s.nav).map((s) =>
          h("a", { class: "shell-link", href: `#${s.id}`, text: s.title || s.id,
            "aria-current": s.id === state.screen || s.id === current.of ? "page" : null }))),
        role ? h("span", { class: "shell-user", text: role.label || role.key }) : null,
      );
    }

    // ---- Note pins ----
    const pinCounts = new Map();
    function placePins() {
      pinLayer.replaceChildren();
      pinCounts.clear();
      const groups = new Map();
      for (const a of state.pins) {
        const p = parse(a);
        if (!p) continue;
        const st = p.walk ? p.walk.steps[p.step - 1] : p;
        const key = `${st.screen}/${st.anchor || ""}`;
        groups.set(key, (groups.get(key) || 0) + 1);
        pinCounts.set(st.screen, (pinCounts.get(st.screen) || 0) + 1);
      }
      const base = stage.getBoundingClientRect();
      for (const [key, count] of groups) {
        const [screen, anchor] = key.split("/");
        if (screen !== state.screen) continue;
        const el = anchor ? anchorEl(screen, anchor) : sectionOf(screen);
        const r = el && el.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) continue;
        pinLayer.append(h("span", { class: "demo-pin", text: String(count),
          style: `left:${Math.max(0, r.right - base.left - 12)}px;top:${Math.max(0, r.top - base.top - 12)}px` }));
      }
      for (const [id, item] of screenItems) {
        const n = pinCounts.get(id) || 0;
        item.count.hidden = !n;
        item.count.textContent = n;
        item.count.title = `${n} note${n === 1 ? "" : "s"}`;
      }
    }

    // ---- Location ----
    let last = null, lastPlaying = false;
    function sync() {
      const a = address();
      const now = playing();
      addressOut.textContent = a;
      if (a === last && now === lastPlaying) return;
      if (a !== last) {
        const moved = last && a.split("?")[0] !== last.split("?")[0];
        last = a;
        if (!hosted) {
          try { history[moved && !now ? "pushState" : "replaceState"](null, "", a); } catch (e) { /* no history here */ }
        }
      }
      lastPlaying = now;
      post("demo:location", now ? { address: a, playing: true } : { address: a });
    }
    const fromUrl = () => { if (location.hash && decodeURI(location.hash) !== decodeURI(last || "")) open(parse(location.hash), true); };
    window.addEventListener("hashchange", fromUrl);
    window.addEventListener("popstate", fromUrl);

    // ---- The panel ----
    const screenItems = new Map();
    const walkItems = new Map();
    let addressOut, player, playerTitle, playerSteps, playerPos, prevBtn, nextBtn, playBtn, annotateBox;
    const roleSelect = h("select", { id: "dp-role", onchange: (e) => { state.role = e.target.value; render(false); } },
      roles.map((r) => h("option", { value: r.key, text: r.label || r.key })));
    const variantSelect = h("select", { id: "dp-variant", onchange: (e) => { state.variant = e.target.value; render(false); } },
      variants.map((v) => h("option", { value: v.key, text: v.label || v.key })));
    const flagBoxes = new Map(flags.map((f) => [f.key, h("input", { type: "checkbox",
      onchange: (e) => { if (e.target.checked) state.flags.add(f.key); else state.flags.delete(f.key); render(false); } })]));
    const settingSelects = new Map(settings.map((s) => [s.key, h("select", { id: `dp-setting-${s.key}`,
      onchange: (e) => { state.settings[s.key] = e.target.value; render(false); } },
      list(s.options).map((o) => h("option", { value: o.value, text: o.label || o.value })))]));
    const vpButtons = new Map(viewports.map((v) => [v.key, h("button", { type: "button", class: "dp-btn", text: v.label || v.key,
      onclick: () => { state.vp = v.key; render(false); } })]));

    function screenTree(parent) {
      const items = screens.filter((s) => (s.of || null) === parent && (parent || !byId.has(s.of)));
      if (!items.length) return null;
      return h("ul", { class: "dp-list" }, items.map((s) => {
        const count = h("span", { class: "dp-count", hidden: true });
        const btn = h("button", { type: "button", class: "dp-item", onclick: () => open({ screen: s.id, anchor: null }, false) },
          h("span", { class: "dp-item-label", text: s.title || s.id }), sectionOf(s.id).hasAttribute("data-state") ? h("span", { class: "dp-tag", text: "state" }) : null, count);
        screenItems.set(s.id, { btn, count });
        return h("li", null, btn, screenTree(s.id));
      }));
    }

    function buildPanel() {
      const sections = [];
      if (meta.question) sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Question" }), h("p", { class: "dp-question", text: meta.question })));
      if (walks.length) {
        playerTitle = h("p", { class: "dp-player-title" });
        playerSteps = h("ol", { class: "dp-steps" });
        playerPos = h("span");
        prevBtn = h("button", { type: "button", class: "dp-btn", text: "← Back", onclick: () => step(-1) });
        nextBtn = h("button", { type: "button", class: "dp-btn", text: "Next →", onclick: () => step(1) });
        playBtn = h("button", { type: "button", class: "dp-btn", "aria-pressed": "false", onclick: togglePlay });
        player = h("div", { class: "dp-player", hidden: true, role: "region", "aria-label": "Walkthrough" },
          playerTitle, playerSteps, h("div", { class: "dp-player-nav" }, prevBtn, playerPos, nextBtn), playBtn,
          h("button", { type: "button", class: "dp-btn", text: "End walkthrough", onclick: () => open({ screen: state.screen, anchor: null }, false) }));
        sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Walkthroughs" }),
          h("ul", { class: "dp-list" }, walks.map((w) => {
            const btn = h("button", { type: "button", class: "dp-item", onclick: () => open({ walk: w, step: 1 }, false) },
              h("span", { class: "dp-item-label", text: w.title || w.id }), h("span", { class: "dp-tag", text: `${w.journey ? "end to end · " : ""}${w.steps.length} steps` }));
            walkItems.set(w.id, btn);
            return h("li", null, btn);
          })), player));
      }
      sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Screens" }), screenTree(null)));
      if (variants.length > 1) sections.push(h("div", { class: "dp-section" }, h("label", { class: "dp-h", for: "dp-variant", text: "Variant" }), h("div", { class: "dp-field" }, variantSelect)));
      if (roles.length) sections.push(h("div", { class: "dp-section" }, h("label", { class: "dp-h", for: "dp-role", text: "Role" }), h("div", { class: "dp-field" }, roleSelect)));
      if (flags.length) sections.push(h("fieldset", { class: "dp-section", style: "border:0;margin:0;padding:10px 0" }, h("legend", { class: "dp-h", text: "Flags" }),
        flags.map((f) => h("label", { class: "dp-check" }, flagBoxes.get(f.key), f.label || f.key))));
      if (settings.length) sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Settings" }),
        settings.map((s) => h("div", { class: "dp-field" }, h("label", { for: `dp-setting-${s.key}`, text: s.label || s.key }), settingSelects.get(s.key)))));
      if (viewports.length > 1) sections.push(h("div", { class: "dp-section", role: "group", "aria-label": "Viewport" }, h("p", { class: "dp-h", text: "Viewport" }), h("div", { class: "dp-row" }, [...vpButtons.values()])));
      if (hosted) {
        annotateBox = h("input", { type: "checkbox", onchange: (e) => { state.annotate = e.target.checked; render(false); } });
        sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Notes" }),
          h("label", { class: "dp-check" }, annotateBox, "Annotate: click an element to note it")));
      }
      addressOut = h("output", { class: "dp-address", "aria-label": "Current address" });
      sections.push(h("div", { class: "dp-section" }, h("p", { class: "dp-h", text: "Address" }), addressOut));
      body.replaceChildren(...sections);
    }

    function step(delta) {
      const w = state.walk && walks.find((x) => x.id === state.walk.id);
      if (w) open({ walk: w, step: Math.min(w.steps.length, Math.max(1, state.walk.step + delta)) }, false);
    }

    function updatePanel() {
      for (const [id, item] of screenItems) {
        if (id === state.screen) item.btn.setAttribute("aria-current", "page");
        else item.btn.removeAttribute("aria-current");
      }
      for (const [id, btn] of walkItems) {
        if (state.walk && state.walk.id === id) btn.setAttribute("aria-current", "true");
        else btn.removeAttribute("aria-current");
      }
      roleSelect.value = state.role ?? "";
      variantSelect.value = state.variant ?? "";
      for (const [k, box] of flagBoxes) box.checked = state.flags.has(k);
      for (const [k, sel] of settingSelects) sel.value = state.settings[k];
      for (const [k, btn] of vpButtons) btn.setAttribute("aria-pressed", String(k === state.vp));
      if (annotateBox) annotateBox.checked = state.annotate;
      const w = currentWalk();
      updateCaption(w);
      if (!player) return;
      player.hidden = !w;
      if (!w) return;
      playerTitle.textContent = w.title || w.id;
      // A playthrough's steps sit under the part of the journey each one shows.
      const items = [];
      let part = null;
      w.steps.forEach((st, i) => {
        if (w.journey && st.part !== part) { part = st.part; items.push(h("li", { class: "dp-part", text: partLabel(part) })); }
        items.push(h("li", null, h("button", { type: "button", class: "dp-item",
          "aria-current": i + 1 === state.walk.step ? "step" : null, onclick: () => open({ walk: w, step: i + 1 }, false) },
          h("span", { class: "dp-item-label", text: st.text || st.screen }))));
      });
      playerSteps.replaceChildren(...items);
      playerPos.textContent = `Step ${state.walk.step} of ${w.steps.length}`;
      prevBtn.disabled = state.walk.step === 1;
      nextBtn.disabled = state.walk.step === w.steps.length;
      playBtn.textContent = playing() ? "❚❚ Pause" : state.walk.step === w.steps.length ? "↺ Play again" : "▶ Play";
      playBtn.setAttribute("aria-pressed", String(playing()));
    }

    // The caption shows a playthrough over the product, so it reads with the panel hidden.
    function updateCaption(w) {
      caption.hidden = !(w && w.journey);
      if (caption.hidden) return;
      const st = w.steps[state.walk.step - 1];
      const parts = [...new Set(w.steps.map((s) => s.part))];
      cap("part").textContent = `Part ${parts.indexOf(st.part) + 1} of ${parts.length} · ${partLabel(st.part)}`;
      cap("text").textContent = st.text || st.screen;
      cap("pos").textContent = `${state.walk.step} / ${w.steps.length}`;
      cap("bar").style.width = `${(100 * state.walk.step) / w.steps.length}%`;
      const btn = cap("play");
      btn.textContent = playing() ? "❚❚ Pause" : state.walk.step === w.steps.length ? "↺ Again" : "▶ Play";
      btn.setAttribute("aria-pressed", String(playing()));
    }
    cap("play").addEventListener("click", togglePlay);

    // ---- Interaction inside the product ----
    stage.addEventListener("click", (e) => {
      if (state.annotate && app.contains(e.target)) {
        e.preventDefault();
        e.stopPropagation();
        const el = e.target.closest("[data-anchor]");
        const anchor = el && anchorEl(state.screen, el.dataset.anchor) === el ? el.dataset.anchor : null;
        post("demo:location", { address: address(), element: screenAddress(anchor) });
        return;
      }
      const t = e.target;
      const submit = t.closest("button[type='submit'], button:not([type]), input[type='submit']");
      if (submit && submit.form && submit.form.hasAttribute("data-goto")) {
        e.preventDefault();
        if (submit.form.reportValidity()) navigate(submit.form.getAttribute("data-goto"));
        return;
      }
      const dialogBtn = t.closest("[data-dialog]");
      if (dialogBtn) { const d = document.getElementById(dialogBtn.dataset.dialog); if (d && d.showModal) { e.preventDefault(); d.showModal(); } return; }
      const close = t.closest("[data-close]");
      if (close && close.closest("dialog")) { e.preventDefault(); close.closest("dialog").close(); }
      const link = t.closest("a[href^='#'], [data-goto]:not(form)");
      if (link) {
        e.preventDefault();
        const d = link.closest("dialog");
        if (d) d.close();
        navigate(link.getAttribute("data-goto") || link.getAttribute("href"));
      }
    }, true);
    app.addEventListener("submit", (e) => e.preventDefault());

    // ---- Messages from the host ----
    window.addEventListener("message", (e) => {
      if (!hosted || e.source !== window.parent) return;
      const m = e.data;
      if (!m || typeof m !== "object" || typeof m.v !== "number" || m.v > V) return;
      if (m.type === "demo:goto") open(parse(m.address), true);
      else if (m.type === "demo:play") { const p = parse(m.address); if (p && p.walk && open(p, true)) play(); }
      else if (m.type === "demo:pins") { state.pins = list(m.addresses).filter((a) => typeof a === "string"); placePins(); }
    });

    document.querySelector("[data-demo-collapse]").addEventListener("click", () => {
      document.documentElement.setAttribute("data-demo-collapsed", "");
      document.querySelector("[data-demo-expand]").focus();
    });
    document.querySelector("[data-demo-expand]").addEventListener("click", () => {
      document.documentElement.removeAttribute("data-demo-collapsed");
      document.querySelector("[data-demo-collapse]").focus();
    });
    if (typeof ResizeObserver === "function") new ResizeObserver(() => placePins()).observe(stage);

    buildPanel();
    if (!home) { body.prepend(h("p", { class: "dp-error", text: "demo-model lists no screen this file has." })); return; }
    post("demo:ready", {
      template: templateVersion(),
      screens: screens.map((s) => ({ id: s.id, title: s.title || s.id, ...(s.of ? { of: s.of } : {}) })),
      anchors: screens.flatMap((s) => list(s.anchors).filter((a) => anchorEl(s.id, a)).map((a) => `${s.id}/${a}`)),
      walkthroughs: walks.map((w) => ({ id: w.id, title: w.title || w.id, ...(w.journey ? { journey: w.journey } : {}), steps: w.steps.map((st) => `${st.screen}${st.anchor ? `/${st.anchor}` : ""}`) })),
    });
    if (!open(parse(location.hash), true)) open({ screen: home, anchor: null }, true);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
<!-- template:end -->
<main data-demo-app>
  <section id="start" data-screen>
    <div class="page">
      <div class="page-head"><h1>Start here</h1></div>
      <div class="card" data-anchor="intro">
        <p>Replace this part with the demo's screens: one <code>section[data-screen]</code> per screen or state, each listed in <code>demo-model</code>.</p>
      </div>
    </div>
  </section>
</main>
<script type="application/json" id="demo-model">
{
  "app": { "name": "Product", "home": "start" },
  "screens": [{ "id": "start", "title": "Start here", "nav": true, "anchors": ["intro"] }],
  "roles": [],
  "flags": [],
  "settings": [],
  "viewports": [
    { "key": "desktop", "label": "Desktop", "default": true },
    { "key": "tablet", "label": "Tablet", "width": 834 },
    { "key": "phone", "label": "Phone", "width": 390 }
  ],
  "variants": [],
  "walkthroughs": []
}
</script>
</body>
</html>
