name: Devbook metadata

# Enforces the devbook convention: every metadata reference must
# resolve and every `meta` block must match the schema. Installed by the
# `devbook:install` skill.
#
# Staleness of the committed _meta indexes is reported but does not fail the
# run — forcing every devbook pull request to carry a regenerated index is
# what makes those files conflict on merge. Refresh is deliberate instead:
# ./build/Update-DevbookIndex.ps1 on demand, devbook-meta-nightly.yml on a
# schedule. See devbook-derived-artifacts.md.
#
# The two path filters below are rendered, not copied. Replace <prefix> with
# `.` in the flat layout and `.devbook/` in the nested one — build.mjs prints
# which layout it found on every run — and delete the rows for folders this
# repository has not adopted. A surviving <prefix> matches nothing, which
# leaves the repository with no gate at all and no error saying so.

on:
  push:
    branches:
      - main
    paths:
      - '<prefix>arc42/**'
      - '<prefix>domain/**'
      - '<prefix>tech/**'
      - '<prefix>design/**'
      - '<prefix>ai/**'
      - '.devbook/tools/devbook-meta/**'
      - '.github/workflows/devbook-meta.yml'
  pull_request:
    branches:
      - main
    paths:
      - '<prefix>arc42/**'
      - '<prefix>domain/**'
      - '<prefix>tech/**'
      - '<prefix>design/**'
      - '<prefix>ai/**'
      - '.devbook/tools/devbook-meta/**'
      - '.github/workflows/devbook-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devbook-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate metadata and derived indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check references and metadata blocks
        run: node .devbook/tools/devbook-meta/build.mjs --check

      # Advisory only. A stale index is not a defect in this pull request; the
      # nightly job reconciles it, and consumers re-read sources newer than the
      # index they read. Broken references above are the hard failure.
      - name: Report drift in the committed indexes
        run: |
          node .devbook/tools/devbook-meta/build.mjs
          if ! git diff --quiet -- '*_meta/*.json'; then
            echo "::warning::Derived _meta indexes have drifted. This does not block the merge — the nightly refresh reconciles it. To refresh this branch now: ./build/Update-DevbookIndex.ps1"
            git --no-pager diff --stat -- '*_meta/*.json'
          fi
