name: Devbook metadata

# Enforces the devbook convention: every metadata reference must
# resolve and every `meta` block must match the schema. Installed by the
# `devbook:install` skill. The check writes nothing and there is nothing
# generated to keep fresh: every derived document is computed where it is read.
#
# The two path filters below are rendered, not copied. Replace <prefix> with
# `.` in the flat layout and `.devbook/` in the nested one — build.mjs prints
# which layout it found on every run — and delete the rows for folders this
# repository has not adopted. A surviving <prefix> matches nothing, which
# leaves the repository with no gate at all and no error saying so.

on:
  push:
    branches:
      - main
    paths:
      - '<prefix>arc42/**'
      - '<prefix>domain/**'
      - '<prefix>tech/**'
      - '<prefix>design/**'
      - '<prefix>ai/**'
      - '.devbook/_tools/devbook-meta/**'
      - '.github/workflows/devbook-meta.yml'
  pull_request:
    branches:
      - main
    paths:
      - '<prefix>arc42/**'
      - '<prefix>domain/**'
      - '<prefix>tech/**'
      - '<prefix>design/**'
      - '<prefix>ai/**'
      - '.devbook/_tools/devbook-meta/**'
      - '.github/workflows/devbook-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devbook-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check references and metadata blocks
        run: node .devbook/_tools/devbook-meta/build.mjs --check
