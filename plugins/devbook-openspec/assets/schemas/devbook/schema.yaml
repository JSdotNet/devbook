name: devbook
version: 1
description: A change to the devbook, proposed as deltas against its chapters — proposal → devbook-delta → solution → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why the change, its scope, and one category
    template: proposal.md
    instruction: |
      Write the proposal per devbook-changes.md. Its file-level meta block is
      `type: change`, `status: proposed`, and `category` — one of `feature`,
      `behaviour-change`, `defect` — because the category picks the flow that
      applies a step. Then two sections, each without a meta block: `## Why` and
      `## Scope`. The deltas name the chapters the change touches.

      When the change carries a demo, `## Why` records the prototype's verdict —
      the question it was made to answer and the answer — and the block may name
      the screens or walkthroughs the change is about in `demo`, per
      devbook-chapter-metadata.md. The demo file itself never records a verdict.

      Read the chapters it touches and walk their `related` links first; never
      load a devbook folder whole. Skip every `annotation` fence: a review note
      is not content. Never write `approved` or `accepted`: only the approve and
      accept gates write those.
    requires: []

  - id: devbook-delta
    generates: "devbook-delta/**/*.md"
    description: One delta per devbook file the change touches, at that file's path
    template: devbook-delta.md
    instruction: |
      One delta per devbook file the change touches, at that file's own path
      below `.devbook/`: `devbook-delta/arc42/09-decisions.md` changes
      `.devbook/arc42/09-decisions.md`. Each opens with a meta block holding
      exactly `change` — this change's folder name — and `delta: added`,
      `modified`, or `removed`, then names chapters by heading at their own
      level, with `ADDED`, `MODIFIED`, and `REMOVED` sections of entries one
      level deeper. The full shape is devbook-changes.md; every chapter a delta
      writes follows its target folder's rule and devbook-chapter-metadata.md.

      A requirement is one SHALL sentence and its `#### Scenario:` cases, in its
      bounded context's requirements.md; an invariant is one sentence and its
      `Enforced at:` line, in its invariants.md — per devbook-domain.md. A
      decision the change makes is a delta too, under `devbook-delta/arc42/adr/`
      when it is architectural.

      A journey changes in a delta of its scenarios file, at
      `devbook-delta/domain/<context>/scenarios.md`. A new journey is an `ADDED`
      entry: its heading one level down, its block with `type: scenario` and the
      setup fields, its lead, and each part one level below that. In a journey
      that exists, a part is replaced whole as a `MODIFIED` entry, never step by
      step. A requirement the journey proves holds
      `Proved by: scenarios.md#<part>` as the whole of its `#### Scenario:` case,
      with no steps of its own: behaviour is written once, in the journey. The
      check resolves a pointer with every delta of the change merged, so it may
      name a journey this change adds.

      A demo is the one delta that is not Markdown. Copy the standalone
      prototype `/prototype` wrote, whole, to the path where it lands —
      `devbook-delta/domain/<context>/features.demo.html` lands as
      `.devbook/domain/<context>/features.demo.html` — trimmed to the one
      variant agreed, with its screen ids and anchors kept. It has no meta
      block and no sections, and the merge replaces its target whole. A logic
      prototype is never copied in: its answer is a delta to domain.md or
      an invariants subpage. Never edit a demo here; a revision is
      a new prototype of the current demo.

      A change with no prose delta still writes one: a placeholder holding only
      the opening meta block, because an empty `devbook-delta/` is unfinished
      and a demo does not match this artifact's glob.
      After every edit run
      `node .devbook/_tools/devbook-meta/delta.mjs --check <change>`.
    requires:
      - proposal

  - id: solution
    generates: solution.md
    description: How to make the change, and the chapters a builder loads beyond the delta
    template: solution.md
    instruction: |
      Instructions for making the change, and nothing that lands in the devbook
      on archive. When the approach is shown in a demo, open with a file-level
      meta block holding only `demo`, naming the screens or walkthroughs a
      builder follows; otherwise write no block. Then name, by address, the chapters a builder must load
      beyond the delta — an existing decision, a related feature or aggregate, a
      tech rating — and why each matters here. Then the approach: order,
      structure, the trade-offs taken. A decision the change makes is never
      written here; it is a delta. Never repeat what a delta already says.
    requires:
      - devbook-delta

  - id: tasks
    generates: tasks.md
    description: The steps of the change, in dependency order
    template: tasks.md
    instruction: |
      `## Step N — title` blocks, in dependency order.
      Under each heading, a `delivers:` line naming the deltas it delivers by
      address — a demo delta by its path, a journey as
      `<scenarios file>#<journey>` or one part as `<scenarios file>#<part>` — then — when a person will do the step — a line reading exactly
      `owner: me`, then the step's tasks as `- [ ]` checkboxes, each saying how
      it is verified.
    requires:
      - solution

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Build the change whole: every open step without `owner: me`, in order, or
    only the step the caller names. Never take a step of a change whose
    proposal is not `approved`. Hand the work to a repo-native flow-* skill
    first, then the delivery engine's flow for the proposal's category, and
    implement inline only when no engine is installed. Tick a step's tasks in
    the commit that completes them.
