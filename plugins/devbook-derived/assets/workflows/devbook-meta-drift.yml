name: Devbook index drift

# Reports, and never fails on, a committed _meta/ index that no longer matches
# the Markdown on this branch. Installed by the `devbook-derived:init` skill.
#
# Forcing every devbook pull request to carry a regenerated index is what makes
# those files conflict on merge, so this is advisory: the nightly refresh
# (devbook-meta-nightly.yml) reconciles the default branch, and
# ./build/Update-DevbookIndex.ps1 refreshes a branch on demand. Broken
# references and schema violations are devbook's own check, devbook-meta.yml.
#
# The path filters below are rendered, not copied: delete the rows for folders
# this repository has not adopted.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.devbook/arc42/**'
      - '.devbook/domain/**'
      - '.devbook/tech/**'
      - '.devbook/design/**'
      - '.devbook/ai/**'
      - '.devbook/_tools/devbook-meta/**'
      - '.devbook/_tools/c4-render/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devbook-meta-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Report drift in the committed indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report drift in the committed indexes
        run: |
          # devbook-meta.yml already fails on a broken reference; this job only warns.
          node .devbook/_tools/devbook-meta/build.mjs --write || true
          if [ -f .devbook/_tools/c4-render/render.mjs ]; then
            node .devbook/_tools/c4-render/render.mjs .devbook/arc42/workspace.dsl .devbook/arc42/_meta/c4 || true
          fi
          # git status, not git diff: an index written for the first time is untracked.
          if [ -n "$(git status --porcelain -- '*_meta/*.json' '*_meta/c4/*.svg')" ]; then
            echo "::warning::Derived _meta indexes or view renders have drifted. This does not block the merge — the nightly refresh reconciles it. To refresh this branch now: ./build/Update-DevbookIndex.ps1"
            git status --short -- '*_meta/*.json' '*_meta/c4/*.svg'
          fi
