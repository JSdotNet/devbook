<svg xmlns="http://www.w3.org/2000/svg" width="1364" height="1232" viewBox="0 0 1364 1232" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="[Dynamic] Shop">
<title>[Dynamic] Shop</title>
<desc>How an order is placed</desc>
<style>
@media (prefers-color-scheme: dark) {
  .c4-bg{fill:#0d1117}
  .c4-ink{fill:#e6edf3}
  .c4-muted{fill:#9198a1}
  .c4-line{stroke:#9198a1}
  .c4-head{fill:#9198a1}
  .c4-edge{stroke:#9198a1}
  .c4-fill-person{fill:#1d5c99;stroke:#6ea2d8}
  .c4-rim-person{stroke:#6ea2d8}
  .c4-ink-person{fill:#ffffff}
  .c4-fill-softwareSystem{fill:#1b6ec2;stroke:#78aee6}
  .c4-rim-softwareSystem{stroke:#78aee6}
  .c4-ink-softwareSystem{fill:#ffffff}
  .c4-fill-container{fill:#2f73b5;stroke:#8dbbea}
  .c4-rim-container{stroke:#8dbbea}
  .c4-ink-container{fill:#ffffff}
  .c4-fill-component{fill:#2a5d8f;stroke:#9cc4ee}
  .c4-rim-component{stroke:#9cc4ee}
  .c4-ink-component{fill:#ffffff}
  .c4-fill-external{fill:#484f58;stroke:#8b949e}
  .c4-rim-external{stroke:#8b949e}
  .c4-ink-external{fill:#ffffff}
}
</style>
<defs>
  <marker id="c4-checkout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path class="c4-head" fill="#57606a" d="M0 0L10 5L0 10Z"/>
  </marker>
</defs>
<rect class="c4-bg" fill="#ffffff" x="0" y="0" width="1364" height="1232"/>
<text class="c4-ink" fill="#1f2328" x="32" y="50" font-size="20" font-weight="600">[Dynamic] Shop</text>
<text class="c4-muted" fill="#59636e" x="32" y="72" font-size="13">How an order is placed</text>
<g transform="translate(32 96)">
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 3" x="688" y="552" width="252" height="484" rx="6"/>
  <text class="c4-muted" fill="#59636e" x="698" y="570" font-size="12" font-weight="600">Backend</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4" x="356" y="258" width="604" height="798" rx="8"/>
  <text class="c4-ink" fill="#1f2328" x="368" y="279" font-size="13" font-weight="600">Shop [Software System]</text>
  <g data-element="customer">
    <circle class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" cx="110" cy="21" r="21"/>
    <rect class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" x="0" y="36" width="220" height="114" rx="27"/>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="80" font-size="15" font-weight="600" text-anchor="middle">Customer</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="98" font-size="11" text-anchor="middle" opacity="0.85">[Person]</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="120" font-size="12" text-anchor="middle">Buys things from the shop</text>
  </g>
  <g data-element="shop.web">
    <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="376" y="290" width="220" height="150" rx="8"/>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="352" font-size="15" font-weight="600" text-anchor="middle">Web</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="370" font-size="11" text-anchor="middle" opacity="0.85">[Container: ASP.NET Core]</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="392" font-size="12" text-anchor="middle">Serves the storefront</text>
  </g>
  <g data-element="shop.api">
    <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="704" y="580" width="220" height="150" rx="8"/>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="642" font-size="15" font-weight="600" text-anchor="middle">API</text>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="660" font-size="11" text-anchor="middle" opacity="0.85">[Container: C#]</text>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="682" font-size="12" text-anchor="middle">Takes and tracks orders</text>
  </g>
  <g data-element="shop.db">
    <path class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" d="M704 883L704 1007A110 13 0 0 0 924 1007L924 883A110 13 0 0 0 704 883Z"/>
    <path class="c4-rim-container" fill="none" stroke="#2e6295" stroke-width="1.5" d="M704 883A110 13 0 0 0 924 883"/>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="945" font-size="15" font-weight="600" text-anchor="middle">Database</text>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="963" font-size="11" text-anchor="middle" opacity="0.85">[Container: PostgreSQL]</text>
    <text class="c4-ink-container" fill="#ffffff" x="814" y="985" font-size="12" text-anchor="middle">Holds orders and stock</text>
  </g>
  <g data-element="payments">
    <rect class="c4-fill-external" fill="#8c959f" stroke="#6e7781" stroke-width="1.5" x="1080" y="870" width="220" height="150" rx="8"/>
    <text class="c4-ink-external" fill="#ffffff" x="1190" y="932" font-size="15" font-weight="600" text-anchor="middle">Payments</text>
    <text class="c4-ink-external" fill="#ffffff" x="1190" y="950" font-size="11" text-anchor="middle" opacity="0.85">[Software System]</text>
    <text class="c4-ink-external" fill="#ffffff" x="1190" y="972" font-size="12" text-anchor="middle">Takes card payments</text>
  </g>
  <g data-relationship="customer -> shop.web" data-step="1">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M88 150C88 220 464 220 464 290"/>
  </g>
  <g data-relationship="shop.web -> shop.api" data-step="2">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M464 440C464 510 792 510 792 580"/>
  </g>
  <g data-relationship="shop.api -> payments" data-step="3">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M836 730C836 800 1190 800 1190 870"/>
  </g>
  <g data-relationship="shop.api -> shop.db" data-step="4">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M792 730C792 800 814 800 814 870"/>
  </g>
  <g data-relationship="shop.api -> shop.web" data-step="5">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M836 580C836 510 508 510 508 440"/>
  </g>
  <g data-relationship="shop.web -> customer" data-step="6">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M508 290C508 220 132 220 132 150"/>
  </g>
  <g class="c4-label" data-relationship="customer -> shop.web" data-step="1">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="215" y="203" width="123" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="276" y="218" font-size="11" text-anchor="middle">1. Places an order</text>
    <text class="c4-muted" fill="#59636e" x="276" y="232" font-size="11" text-anchor="middle">[HTTPS]</text>
  </g>
  <g class="c4-label" data-relationship="shop.web -> shop.api" data-step="2">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="560" y="493" width="136" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="628" y="508" font-size="11" text-anchor="middle">2. Submits the order</text>
    <text class="c4-muted" fill="#59636e" x="628" y="522" font-size="11" text-anchor="middle">[HTTPS/JSON]</text>
  </g>
  <g class="c4-label" data-relationship="shop.api -> payments" data-step="3">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="948" y="790" width="130" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="1013" y="805" font-size="11" text-anchor="middle">3. Charges the card</text>
  </g>
  <g class="c4-label" data-relationship="shop.api -> shop.db" data-step="4">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="742" y="790" width="123" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="803" y="805" font-size="11" text-anchor="middle">4. Saves the order</text>
  </g>
  <g class="c4-label" data-relationship="shop.api -> shop.web" data-step="5">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="714" y="528" width="142" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="785" y="543" font-size="11" text-anchor="middle">5. Confirms the order</text>
  </g>
  <g class="c4-label" data-relationship="shop.web -> customer" data-step="6">
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="366" y="238" width="167" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="449" y="253" font-size="11" text-anchor="middle">6. Shows the confirmation</text>
  </g>
</g>
<g class="c4-legend">
  <rect class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" x="32" y="1184" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="64" y="1197" font-size="12">Person</text>
  <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="129" y="1184" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="161" y="1197" font-size="12">Container</text>
  <rect class="c4-fill-external" fill="#8c959f" stroke="#6e7781" stroke-width="1.5" x="246" y="1184" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="278" y="1197" font-size="12">External</text>
  <path class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" d="M356 1186L356 1198A12 4 0 0 0 380 1198L380 1186A12 4 0 0 0 356 1186Z"/>
  <path class="c4-rim-container" fill="none" stroke="#2e6295" stroke-width="1.5" d="M356 1186A12 4 0 0 0 380 1186"/>
  <text class="c4-ink" fill="#1f2328" x="388" y="1197" font-size="12">Database</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4" x="466" y="1184" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="498" y="1197" font-size="12">Boundary</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 3" x="576" y="1184" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="608" y="1197" font-size="12">Group</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-checkout-arrow)" d="M666 1192L688 1192"/>
  <text class="c4-ink" fill="#1f2328" x="698" y="1197" font-size="12">Numbered step</text>
</g>
</svg>
