    <rect class="c4-fill-component" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5" x="93" y="0" width="142" height="44" rx="4"/>
    <text class="c4-ink-component" fill="#0b2540" x="164" y="16" font-size="11" text-anchor="middle">«interface»</text>
    <text class="c4-ink-component" fill="#0b2540" x="164" y="34" font-size="14" font-weight="600" text-anchor="middle">IAggregateRoot</text>
  </g>
  <g data-class="OrderPlaced">
    <rect class="c4-bg c4-edge" fill="#ffffff" stroke="#57606a" stroke-width="1.5" x="188" y="384" width="140" height="60" rx="4"/>
    <rect class="c4-fill-component" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5" x="188" y="384" width="140" height="44" rx="4"/>
    <text class="c4-ink-component" fill="#0b2540" x="258" y="400" font-size="11" text-anchor="middle">«domain event»</text>
    <text class="c4-ink-component" fill="#0b2540" x="258" y="418" font-size="14" font-weight="600" text-anchor="middle">OrderPlaced</text>
