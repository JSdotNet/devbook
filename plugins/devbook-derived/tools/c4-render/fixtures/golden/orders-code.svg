    <path class="c4-bg c4-line" fill="#ffffff" stroke="#57606a" stroke-width="1.5" d="M0 0L14 7L0 14Z"/>
  </marker>
  <marker id="c4-orders-code-composition" viewBox="-1 -1 20 14" refX="18" refY="6" markerWidth="20" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path class="c4-head" fill="#57606a" d="M0 6L9 0L18 6L9 12Z"/>
  </marker>
  <marker id="c4-orders-code-association" viewBox="-1 -1 12 12" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
