  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-orders-code-realization)" d="M130 748L162 748"/>
  <text class="c4-ink" fill="#1f2328" x="170" y="753" font-size="12">Realization</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-orders-code-composition)" d="M268 748L300 748"/>
  <text class="c4-ink" fill="#1f2328" x="308" y="753" font-size="12">Composition</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-orders-code-association)" d="M406 748L438 748"/>
  <text class="c4-ink" fill="#1f2328" x="446" y="753" font-size="12">Association</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-orders-code-dependency)" d="M544 748L576 748"/>
  <text class="c4-ink" fill="#1f2328" x="584" y="753" font-size="12">Dependency</text>
</g>
