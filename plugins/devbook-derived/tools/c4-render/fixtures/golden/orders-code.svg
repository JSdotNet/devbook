<svg xmlns="http://www.w3.org/2000/svg" width="684" height="788" viewBox="0 0 684 788" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="[Code] Orders">
<title>[Code] Orders</title>
<style>
@media (prefers-color-scheme: dark) {
  .c4-bg{fill:#0d1117}
  .c4-ink{fill:#e6edf3}
  .c4-muted{fill:#9198a1}
  .c4-line{stroke:#9198a1}
  .c4-head{fill:#9198a1}
  .c4-edge{stroke:#9198a1}
  .c4-fill-component{fill:#2a5d8f;stroke:#9cc4ee}
  .c4-ink-component{fill:#ffffff}
}
</style>
<defs>
