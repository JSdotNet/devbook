    <text class="c4-muted" fill="#59636e" x="88" y="351" font-size="11" text-anchor="middle">many</text>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="88" y="322" width="43" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="109" y="336" font-size="11" text-anchor="middle">holds</text>
  </g>
  <g data-relationship="OrderLine association Money">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-orders-code-association)" d="M91 452L139 540"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="81" y="486" width="68" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="115" y="500" font-size="11" text-anchor="middle">priced in</text>
  </g>
  <g data-relationship="Order dependency OrderPlaced">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-orders-code-dependency)" d="M198 288L244 384"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="197" y="326" width="49" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="221" y="340" font-size="11" text-anchor="middle">raises</text>
  </g>
</g>
<g class="c4-legend">
