    <text class="c4-ink" fill="#1f2328" x="106" y="604" font-size="12">+decimal Amount</text>
    <text class="c4-ink" fill="#1f2328" x="106" y="620" font-size="12">+string Currency</text>
  </g>
  <g data-class="IAggregateRoot">
