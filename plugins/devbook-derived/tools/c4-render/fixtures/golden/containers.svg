    <text class="c4-ink-container" fill="#ffffff" x="830" y="626" font-size="15" font-weight="600" text-anchor="middle">API</text>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="644" font-size="11" text-anchor="middle" opacity="0.85">[Container: C#]</text>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="666" font-size="12" text-anchor="middle">Takes and tracks orders</text>
  </g>
  <g data-element="shop.db">
    <path class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" d="M1080 577L1080 701A110 13 0 0 0 1300 701L1300 577A110 13 0 0 0 1080 577Z"/>
    <path class="c4-rim-container" fill="none" stroke="#2e6295" stroke-width="1.5" d="M1080 577A110 13 0 0 0 1300 577"/>
    <text class="c4-ink-container" fill="#ffffff" x="1190" y="639" font-size="15" font-weight="600" text-anchor="middle">Database</text>
    <text class="c4-ink-container" fill="#ffffff" x="1190" y="657" font-size="11" text-anchor="middle" opacity="0.85">[Container: PostgreSQL]</text>
    <text class="c4-ink-container" fill="#ffffff" x="1190" y="679" font-size="12" text-anchor="middle">Holds orders and stock</text>
  </g>
  <g data-element="warehouse">
    <rect class="c4-fill-softwareSystem" fill="#1168bd" stroke="#0b4884" stroke-width="1.5" x="1080" y="1338" width="220" height="150" rx="8"/>
    <text class="c4-ink-softwareSystem" fill="#ffffff" x="1190" y="1400" font-size="15" font-weight="600" text-anchor="middle">Warehouse</text>
    <text class="c4-ink-softwareSystem" fill="#ffffff" x="1190" y="1418" font-size="11" text-anchor="middle" opacity="0.85">[Software System]</text>
    <text class="c4-ink-softwareSystem" fill="#ffffff" x="1190" y="1440" font-size="12" text-anchor="middle">Plans picking and shipping</text>
  </g>
  <g data-element="mail">
