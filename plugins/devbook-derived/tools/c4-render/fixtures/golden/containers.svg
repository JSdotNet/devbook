<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="[Container] Shop">
<title>[Container] Shop</title>
<style>
@media (prefers-color-scheme: dark) {
  .c4-bg{fill:#0d1117}
  .c4-ink{fill:#e6edf3}
  .c4-muted{fill:#9198a1}
  .c4-line{stroke:#9198a1}
  .c4-head{fill:#9198a1}
  .c4-edge{stroke:#9198a1}
  .c4-fill-person{fill:#1d5c99;stroke:#6ea2d8}
  .c4-rim-person{stroke:#6ea2d8}
  .c4-ink-person{fill:#ffffff}
  .c4-fill-softwareSystem{fill:#1b6ec2;stroke:#78aee6}
  .c4-rim-softwareSystem{stroke:#78aee6}
  .c4-ink-softwareSystem{fill:#ffffff}
  .c4-fill-container{fill:#2f73b5;stroke:#8dbbea}
  .c4-rim-container{stroke:#8dbbea}
  .c4-ink-container{fill:#ffffff}
  .c4-fill-component{fill:#2a5d8f;stroke:#9cc4ee}
  .c4-rim-component{stroke:#9cc4ee}
  .c4-ink-component{fill:#ffffff}
  .c4-fill-external{fill:#484f58;stroke:#8b949e}
  .c4-rim-external{stroke:#8b949e}
  .c4-ink-external{fill:#ffffff}
}
</style>
<defs>
  <marker id="c4-containers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path class="c4-head" fill="#57606a" d="M0 0L10 5L0 10Z"/>
  </marker>
</defs>
<rect class="c4-bg" fill="#ffffff" x="0" y="0" width="1400" height="1660"/>
<text class="c4-ink" fill="#1f2328" x="32" y="50" font-size="20" font-weight="600">[Container] Shop</text>
<g transform="translate(32 76)">
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 3" x="704" y="536" width="612" height="194" rx="6"/>
  <text class="c4-muted" fill="#59636e" x="714" y="554" font-size="12" font-weight="600">Backend</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 3" x="1064" y="1310" width="252" height="194" rx="6"/>
  <text class="c4-muted" fill="#59636e" x="1074" y="1328" font-size="12" font-weight="600">Shop company</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4" x="340" y="274" width="996" height="476" rx="8"/>
  <text class="c4-ink" fill="#1f2328" x="352" y="295" font-size="13" font-weight="600">Shop [Software System]</text>
  <g data-element="customer">
    <circle class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" cx="110" cy="21" r="21"/>
    <rect class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" x="0" y="36" width="220" height="114" rx="27"/>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="80" font-size="15" font-weight="600" text-anchor="middle">Customer</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="98" font-size="11" text-anchor="middle" opacity="0.85">[Person]</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="120" font-size="12" text-anchor="middle">Buys things from the shop</text>
  </g>
  <g data-element="shop.web">
    <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="360" y="306" width="220" height="150" rx="8"/>
    <text class="c4-ink-container" fill="#ffffff" x="470" y="368" font-size="15" font-weight="600" text-anchor="middle">Web</text>
    <text class="c4-ink-container" fill="#ffffff" x="470" y="386" font-size="11" text-anchor="middle" opacity="0.85">[Container: ASP.NET Core]</text>
    <text class="c4-ink-container" fill="#ffffff" x="470" y="408" font-size="12" text-anchor="middle">Serves the storefront</text>
  </g>
  <g data-element="shop.api">
