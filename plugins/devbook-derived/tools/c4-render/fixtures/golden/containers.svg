    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="607" y="493" width="86" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="650" y="508" font-size="11" text-anchor="middle">Calls</text>
    <text class="c4-muted" fill="#59636e" x="650" y="522" font-size="11" text-anchor="middle">[HTTPS/JSON]</text>
  </g>
  <g data-relationship="shop.api -> shop.db">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-containers-arrow)" d="M940 624C987 624 1033 639 1080 639"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="955" y="615" width="111" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="1010" y="630" font-size="11" text-anchor="middle">Reads and writes</text>
    <text class="c4-muted" fill="#59636e" x="1010" y="644" font-size="11" text-anchor="middle">[EF Core]</text>
  </g>
  <g data-relationship="customer -> shop.web">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-containers-arrow)" d="M220 60C337 60 243 381 360 381"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="219" y="204" width="142" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="290" y="219" font-size="11" text-anchor="middle">Browses and orders on</text>
    <text class="c4-muted" fill="#59636e" x="290" y="233" font-size="11" text-anchor="middle">[HTTPS]</text>
  </g>
  <g data-relationship="shop.api -> mail">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-containers-arrow)" d="M940 654C1052 654 968 960 1080 960"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="949" y="790" width="123" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="1010" y="805" font-size="11" text-anchor="middle">Sends mail through</text>
    <text class="c4-muted" fill="#59636e" x="1010" y="819" font-size="11" text-anchor="middle">[SMTP]</text>
  </g>
  <g data-relationship="shop.api -> payments">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-containers-arrow)" d="M808 714C808 890 1190 904 1190 1080"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="928" y="880" width="142" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="999" y="895" font-size="11" text-anchor="middle">Charges the card with</text>
    <text class="c4-muted" fill="#59636e" x="999" y="909" font-size="11" text-anchor="middle">[HTTPS]</text>
  </g>
  <g data-relationship="shop.api -> warehouse">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-containers-arrow)" d="M852 714C852 951 1190 1101 1190 1338"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="969" y="1009" width="105" height="34" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="1021" y="1024" font-size="11" text-anchor="middle">Hands orders to</text>
    <text class="c4-muted" fill="#59636e" x="1021" y="1038" font-size="11" text-anchor="middle">[AMQP]</text>
  </g>
  <g data-relationship="mail -> customer">
    <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-containers-arrow)" d="M1080 930L1020 930Q1010 930 1010 920L1010 520Q1010 510 1000 510L300 510Q290 510 290 500L290 100Q290 90 280 90L220 90"/>
    <rect class="c4-bg" fill="#ffffff" fill-opacity="0.9" x="595" y="500" width="111" height="20" rx="3"/>
    <text class="c4-ink" fill="#1f2328" x="650" y="515" font-size="11" text-anchor="middle">Delivers mail to</text>
  </g>
</g>
<g class="c4-legend">
  <rect class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" x="32" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="64" y="1625" font-size="12">Person</text>
  <rect class="c4-fill-softwareSystem" fill="#1168bd" stroke="#0b4884" stroke-width="1.5" x="129" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="161" y="1625" font-size="12">Software System</text>
  <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="286" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="318" y="1625" font-size="12">Container</text>
  <rect class="c4-fill-external" fill="#8c959f" stroke="#6e7781" stroke-width="1.5" x="403" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="435" y="1625" font-size="12">External</text>
  <path class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" d="M513 1614L513 1626A12 4 0 0 0 537 1626L537 1614A12 4 0 0 0 513 1614Z"/>
  <path class="c4-rim-container" fill="none" stroke="#2e6295" stroke-width="1.5" d="M513 1614A12 4 0 0 0 537 1614"/>
  <text class="c4-ink" fill="#1f2328" x="545" y="1625" font-size="12">Database</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4" x="623" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="655" y="1625" font-size="12">Boundary</text>
  <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 3" x="733" y="1612" width="24" height="16" rx="3"/>
  <text class="c4-ink" fill="#1f2328" x="765" y="1625" font-size="12">Group</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#c4-containers-arrow)" d="M823 1620L845 1620"/>
  <text class="c4-ink" fill="#1f2328" x="855" y="1625" font-size="12">Relationship</text>
  <path class="c4-line" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c4-containers-arrow)" d="M960 1620L982 1620"/>
  <text class="c4-ink" fill="#1f2328" x="992" y="1625" font-size="12">Implied relationship</text>
</g>
</svg>
