  </marker>
</defs>
<rect class="c4-bg" fill="#ffffff" x="0" y="0" width="1252" height="1708"/>
<text class="c4-ink" fill="#1f2328" x="32" y="50" font-size="20" font-weight="600">[Deployment] Live</text>
<text class="c4-muted" fill="#59636e" x="32" y="72" font-size="13">The shop as it runs in production</text>
<g transform="translate(32 192)">
