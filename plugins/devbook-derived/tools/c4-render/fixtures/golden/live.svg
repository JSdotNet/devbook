    <text class="c4-ink-infrastructureNode" fill="#1f2328" x="126" y="62" font-size="15" font-weight="600" text-anchor="middle">Gateway</text>
    <text class="c4-ink-infrastructureNode" fill="#1f2328" x="126" y="80" font-size="11" text-anchor="middle" opacity="0.85">[Infrastructure Node: Application G…</text>
    <text class="c4-ink-infrastructureNode" fill="#1f2328" x="126" y="102" font-size="12" text-anchor="middle">Routes HTTPS traffic</text>
