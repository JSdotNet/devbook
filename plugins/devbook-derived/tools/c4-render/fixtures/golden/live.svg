  </g>
  <g data-deployment-node="live.cloud.app">
    <rect class="c4-edge" fill="none" stroke="#57606a" stroke-width="1.5" x="296" y="370" width="252" height="632" rx="6"/>
  </g>
  <g data-deployment-node="live.cloud.data">
