    <text class="c4-ink-container" fill="#ffffff" x="110" y="839" font-size="11" text-anchor="middle" opacity="0.85">[Container: Claude Code plugin]</text>
    <text class="c4-ink-container" fill="#ffffff" x="110" y="861" font-size="12" text-anchor="middle">The delivery engine: one unit of</text>
