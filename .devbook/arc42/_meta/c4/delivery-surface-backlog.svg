    <text class="c4-muted" fill="#59636e" x="650" y="416" font-size="11" text-anchor="middle">[streamable HTTP, loopback]</text>
  </g>
  <g class="c4-label" data-relationship="marketplace.delivery -> marketplace.delivery-surface-backlog.proxy-server">
