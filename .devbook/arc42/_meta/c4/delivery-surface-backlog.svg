    <text class="c4-ink" fill="#1f2328" x="650" y="129" font-size="11" text-anchor="middle">app&#39;s address through</text>
  </g>
  <g class="c4-label" data-relationship="marketplace.delivery-surface-backlog.proxy-server -> marketplace.delivery-surface-backlog.declared-tools">
