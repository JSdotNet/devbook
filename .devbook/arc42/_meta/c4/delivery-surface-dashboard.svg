    <text class="c4-ink-component" fill="#0b2540" x="470" y="192" font-size="12" text-anchor="middle">A hook on the host&#39;s tool events</text>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="207" font-size="12" text-anchor="middle">folding tool calls, sub-agents,</text>
