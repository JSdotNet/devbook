    <text class="c4-ink-component" fill="#0b2540" x="830" y="207" font-size="12" text-anchor="middle">prompts, evidence, gate</text>
    <text class="c4-ink-component" fill="#0b2540" x="830" y="222" font-size="12" text-anchor="middle">decisions, telemetry, and…</text>
