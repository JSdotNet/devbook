    <text class="c4-ink-container" fill="#ffffff" x="470" y="876" font-size="12" text-anchor="middle">work carried from request to</text>
    <text class="c4-ink-container" fill="#ffffff" x="470" y="891" font-size="12" text-anchor="middle">review-ready change inside one…</text>
