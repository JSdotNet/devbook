    <text class="c4-ink-external" fill="#ffffff" x="1750" y="957" font-size="12" text-anchor="middle">A repository that installs a</text>
    <text class="c4-ink-external" fill="#ffffff" x="1750" y="972" font-size="12" text-anchor="middle">component and keeps its stamp in</text>
    <text class="c4-ink-external" fill="#ffffff" x="1750" y="987" font-size="12" text-anchor="middle">.devbook/config.json.</text>
