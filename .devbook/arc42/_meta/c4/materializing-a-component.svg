    <text class="c4-ink-container" fill="#ffffff" x="486" y="627" font-size="15" font-weight="600" text-anchor="middle">devbook</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="645" font-size="11" text-anchor="middle" opacity="0.85">[Container: Claude Code plugin]</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="667" font-size="12" text-anchor="middle">Addressed Markdown chapters,</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="682" font-size="12" text-anchor="middle">their meta block, the check, and</text>
    <text class="c4-ink-container" fill="#ffffff" x="486" y="697" font-size="12" text-anchor="middle">the reconcile that puts the…</text>
  </g>
