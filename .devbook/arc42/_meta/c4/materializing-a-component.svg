    <rect class="c4-fill-person" fill="#08427b" stroke="#052e56" stroke-width="1.5" x="0" y="36" width="220" height="114" rx="27"/>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="72" font-size="15" font-weight="600" text-anchor="middle">The maintainer</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="90" font-size="11" text-anchor="middle" opacity="0.85">[Person]</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="112" font-size="12" text-anchor="middle">Authors every asset by hand,</text>
    <text class="c4-ink-person" fill="#ffffff" x="110" y="127" font-size="12" text-anchor="middle">runs the checks, and releases…</text>
