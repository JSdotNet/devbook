    <text class="c4-ink-container" fill="#ffffff" x="766" y="645" font-size="11" text-anchor="middle" opacity="0.85">[Container: Claude Code plugin]</text>
    <text class="c4-ink-container" fill="#ffffff" x="766" y="667" font-size="12" text-anchor="middle">The delivery engine: one unit of</text>
    <text class="c4-ink-container" fill="#ffffff" x="766" y="682" font-size="12" text-anchor="middle">work carried from request to</text>
    <text class="c4-ink-container" fill="#ffffff" x="766" y="697" font-size="12" text-anchor="middle">review-ready change inside one…</text>
