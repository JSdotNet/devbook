    <text class="c4-ink-external" fill="#ffffff" x="2030" y="957" font-size="12" text-anchor="middle">The authoring host that loads</text>
    <text class="c4-ink-external" fill="#ffffff" x="2030" y="972" font-size="12" text-anchor="middle">manifests, skills, agents,</text>
    <text class="c4-ink-external" fill="#ffffff" x="2030" y="987" font-size="12" text-anchor="middle">hooks, and MCP servers, and run…</text>
