<svg xmlns="http://www.w3.org/2000/svg" width="2204" height="1196" viewBox="0 0 2204 1196" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="[Dynamic] jsdotnet-devbook marketplace">
<title>[Dynamic] jsdotnet-devbook marketplace</title>
<desc>devbook-config running each component&#39;s own install in a repository.</desc>
<style>
