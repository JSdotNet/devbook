    <text class="c4-ink-component" fill="#0b2540" x="830" y="54" font-size="15" font-weight="600" text-anchor="middle">State Contract</text>
    <text class="c4-ink-component" fill="#0b2540" x="830" y="72" font-size="11" text-anchor="middle" opacity="0.85">[Component: TypeScript]</text>
    <text class="c4-ink-component" fill="#0b2540" x="830" y="94" font-size="12" text-anchor="middle">The type declarations of the</text>
    <text class="c4-ink-component" fill="#0b2540" x="830" y="109" font-size="12" text-anchor="middle">state the module keeps.</text>
  </g>
  <g data-element="marketplace.delivery-run-view.gate-sound">
