  <g data-element="marketplace.delivery-surface-dashboard">
    <rect class="c4-fill-container" fill="#438dd5" stroke="#2e6295" stroke-width="1.5" x="720" y="774" width="220" height="150" rx="8"/>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="828" font-size="15" font-weight="600" text-anchor="middle">delivery-surface-dashbo…</text>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="846" font-size="11" text-anchor="middle" opacity="0.85">[Container: MCP server]</text>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="868" font-size="12" text-anchor="middle">The live view of a run, measured</text>
    <text class="c4-ink-container" fill="#ffffff" x="830" y="883" font-size="12" text-anchor="middle">by hooks rather than told.</text>
  </g>
  <g data-element="marketplace.delivery-run-view.register-module">
    <rect class="c4-fill-component" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5" x="360" y="105" width="220" height="150" rx="4"/>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="152" font-size="15" font-weight="600" text-anchor="middle">Register Module</text>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="170" font-size="11" text-anchor="middle" opacity="0.85">[Component: TypeScript]</text>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="192" font-size="12" text-anchor="middle">Polls the run files, infers what</text>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="207" font-size="12" text-anchor="middle">they leave out, and draws the</text>
    <text class="c4-ink-component" fill="#0b2540" x="470" y="222" font-size="12" text-anchor="middle">pane, band, rows, status line,…</text>
  </g>
  <g data-element="marketplace.delivery-run-view.state-contract">
