<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1148" viewBox="0 0 1024 1148" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="[Component] jsdotnet-devbook marketplace - delivery-run-view">
