    <text class="c4-ink-external" fill="#ffffff" x="110" y="563" font-size="15" font-weight="600" text-anchor="middle">Claude Code</text>
    <text class="c4-ink-external" fill="#ffffff" x="110" y="581" font-size="11" text-anchor="middle" opacity="0.85">[Software System]</text>
    <text class="c4-ink-external" fill="#ffffff" x="110" y="603" font-size="12" text-anchor="middle">The authoring host that loads</text>
    <text class="c4-ink-external" fill="#ffffff" x="110" y="618" font-size="12" text-anchor="middle">manifests, skills, agents,</text>
    <text class="c4-ink-external" fill="#ffffff" x="110" y="633" font-size="12" text-anchor="middle">hooks, and MCP servers, and run…</text>
  </g>
  <g data-element="backlog">
    <rect class="c4-fill-external" fill="#8c959f" stroke="#6e7781" stroke-width="1.5" x="720" y="516" width="220" height="150" rx="8"/>
    <text class="c4-ink-external" fill="#ffffff" x="830" y="563" font-size="15" font-weight="600" text-anchor="middle">Backlog desktop app</text>
    <text class="c4-ink-external" fill="#ffffff" x="830" y="581" font-size="11" text-anchor="middle" opacity="0.85">[Software System]</text>
    <text class="c4-ink-external" fill="#ffffff" x="830" y="603" font-size="12" text-anchor="middle">Holds the work items, reads the</text>
    <text class="c4-ink-external" fill="#ffffff" x="830" y="618" font-size="12" text-anchor="middle">committed _meta/ index off disk,</text>
    <text class="c4-ink-external" fill="#ffffff" x="830" y="633" font-size="12" text-anchor="middle">and answers as a surface.</text>
  </g>
