    <text class="c4-ink-component" fill="#0b2540" x="830" y="304" font-size="12" text-anchor="middle">The clip played when a run</text>
    <text class="c4-ink-component" fill="#0b2540" x="830" y="319" font-size="12" text-anchor="middle">reaches a gate or blocks.</text>
  </g>
  <g data-element="claude-code">
